name: Update manifest

# PR 合併進 main 後，自動重新產生 manifest.json 並提交回去
on:
  push:
    branches: [main]
    paths:
      - "files/**"
      - "tools/make_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: python3 tools/make_manifest.py

      - name: Commit manifest if changed
        run: |
          if [ -z "$(git status --porcelain manifest.json)" ]; then
            echo "manifest.json 沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest [skip ci]"
          git push
