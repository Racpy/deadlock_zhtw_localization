name: Release client

# 打 tag（例如 client-v1.0.0）時，把 client/ 打包成 zip 放到 Releases 供玩家下載
on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip client
        run: |
          cd client
          zip -r ../deadlock_zhtw_localization-Updater.zip .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" deadlock_zhtw_localization-Updater.zip --generate-notes
