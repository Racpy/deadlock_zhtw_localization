name: Release client

# 打 tag（例如 client-v1.0.0）時，在 Windows 上編出兩種版本並放到 Releases
on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GUI and NoGUI packages
        shell: powershell
        run: ./tools/build_client.ps1

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
